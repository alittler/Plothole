backend:
  name: test

media_folder: public/media
public_path: /media

collections:
  - name: characters
    label: Characters
    folder: .decap/characters
    create: true
    slug: "{{slug}}"
    format: yaml
    fields:
      - {label: "ID", name: "id", widget: "string", required: true}
      - {label: "Name", name: "name", widget: "string", required: true}
      - {label: "Species", name: "species", widget: "string"}
      - {label: "Tier", name: "tier", widget: "select", options: ["1", "2", "3"], default: "2"}
      - {label: "Role", name: "role", widget: "string"}
      - {label: "Description", name: "description", widget: "markdown"}
      - {label: "Motivation", name: "motivation", widget: "text"}
      - {label: "Conflict", name: "conflict", widget: "text"}
      - {label: "Primary Trait", name: "primary_trait", widget: "string"}
      - {label: "Traits", name: "traits", widget: "list", field: {label: "Trait", name: "trait", widget: "string"}}
      - {label: "Job", name: "job", widget: "string"}
      - {label: "Age", name: "age", widget: "string"}
      - {label: "Birthplace", name: "birthplace", widget: "string"}
      - {label: "Residence", name: "residence", widget: "string"}
      - {label: "Gender", name: "gender", widget: "string"}
      - {label: "Nationality", name: "nationality", widget: "string"}
      - {label: "Source", name: "source", widget: "select", options: ["manual", "ai"], default: "manual"}

  - name: locations
    label: Locations
    folder: .decap/locations
    create: true
    slug: "{{slug}}"
    format: yaml
    fields:
      - {label: "ID", name: "id", widget: "string", required: true}
      - {label: "Name", name: "name", widget: "string", required: true}
      - {label: "Type", name: "type", widget: "string"}
      - {label: "Tier", name: "tier", widget: "select", options: ["1", "2", "3"], default: "2"}
      - {label: "Description", name: "description", widget: "markdown"}
      - {label: "Climate", name: "climate", widget: "string"}
      - {label: "Population", name: "population", widget: "string"}
      - {label: "Government", name: "government", widget: "string"}
      - {label: "Culture", name: "culture", widget: "text"}
      - {label: "Latitude", name: "latitude", widget: "number"}
      - {label: "Longitude", name: "longitude", widget: "number"}
      - {label: "Inhabitants", name: "inhabitants", widget: "list", field: {label: "Character ID", name: "id", widget: "string"}}
      - {label: "Source", name: "source", widget: "select", options: ["manual", "ai"], default: "manual"}

  - name: items
    label: Items & Artifacts
    folder: .decap/items
    create: true
    slug: "{{slug}}"
    format: yaml
    fields:
      - {label: "ID", name: "id", widget: "string", required: true}
      - {label: "Name", name: "name", widget: "string", required: true}
      - {label: "Type", name: "type", widget: "string"}
      - {label: "Tier", name: "tier", widget: "select", options: ["1", "2", "3"], default: "2"}
      - {label: "Description", name: "description", widget: "markdown"}
      - {label: "Origin", name: "origin", widget: "text"}
      - {label: "Powers", name: "powers", widget: "text"}
      - {label: "Current Owner", name: "owner", widget: "string"}
      - {label: "Current Location", name: "location", widget: "string"}
      - {label: "Source", name: "source", widget: "select", options: ["manual", "ai"], default: "manual"}

  - name: events
    label: Events & Timeline
    folder: .decap/events
    create: true
    slug: "{{slug}}"
    format: yaml
    fields:
      - {label: "ID", name: "id", widget: "string", required: true}
      - {label: "Name", name: "name", widget: "string", required: true}
      - {label: "Type", name: "type", widget: "string"}
      - {label: "Tier", name: "tier", widget: "select", options: ["1", "2", "3"], default: "2"}
      - {label: "Description", name: "description", widget: "markdown"}
      - {label: "Start Date", name: "startDate", widget: "string"}
      - {label: "End Date", name: "endDate", widget: "string"}
      - {label: "Duration", name: "duration", widget: "string"}
      - {label: "Location ID", name: "location_id", widget: "string"}
      - {label: "Attendees", name: "attendees", widget: "list", field: {label: "Character ID", name: "id", widget: "string"}}
      - {label: "Consequences", name: "consequences", widget: "text"}
      - {label: "Source", name: "source", widget: "select", options: ["manual", "ai"], default: "manual"}

  - name: lore
    label: Lore & Worldbuilding
    folder: .decap/lore
    create: true
    slug: "{{slug}}"
    format: yaml
    fields:
      - {label: "ID", name: "id", widget: "string", required: true}
      - {label: "Name", name: "name", widget: "string", required: true}
      - {label: "Category", name: "category", widget: "string"}
      - {label: "Tier", name: "tier", widget: "select", options: ["1", "2", "3"], default: "2"}
      - {label: "Description", name: "description", widget: "markdown"}
      - {label: "Origin", name: "origin", widget: "markdown"}
      - {label: "Significance", name: "significance", widget: "markdown"}
      - {label: "Related Concepts", name: "relatedConcepts", widget: "list", field: {label: "Concept", name: "concept", widget: "string"}}
      - {label: "Source", name: "source", widget: "select", options: ["manual", "ai"], default: "manual"}

  - name: relationships
    label: Relationships
    folder: .decap/relationships
    create: true
    slug: "{{slug}}"
    format: yaml
    fields:
      - {label: "ID", name: "id", widget: "string", required: true}
      - {label: "Entity A ID", name: "entityA", widget: "string", required: true}
      - {label: "Entity B ID", name: "entityB", widget: "string", required: true}
      - {label: "Relationship Type", name: "relationship", widget: "string", required: true}
      - {label: "Description", name: "description", widget: "markdown"}
      - {label: "Bidirectional", name: "bidirectional", widget: "boolean", default: false}
