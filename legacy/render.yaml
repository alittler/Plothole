services:
  - type: web
    name: plothole
    runtime: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
